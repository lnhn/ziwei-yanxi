[package]
name = "ziwei-yanxi"
version = "0.1.0"
description = "紫微研习 —— 看天看地的紫微斗数研习桌面端"
authors = ["Renhuai"]
edition = "2021"

[lib]
name = "ziwei_yanxi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
# 本机页面文件偏小（提交上限 ≈ 32GB，常被其它程序占掉大半），
# 开 LTO + codegen-units=1 会让 rustc 一次性吃满内存、直接 STATUS_STACK_BUFFER_OVERRUN。
# 先关 LTO 保证能出包，体积差 1–2MB，换稳定。
codegen-units = 4
lto = false
opt-level = "s"
panic = "abort"
strip = true
